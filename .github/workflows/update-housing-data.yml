name: Update Housing Data

on:
  schedule:
    # NBS publishes the 70-city index around the 15th-18th of each month.
    # Run on the 20th (shortly after publication, while it is still on the
    # first listing page) and again on the 28th as a retry.
    - cron: '0 8 20 * *'
    - cron: '0 8 28 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 matplotlib pandas numpy

      - name: Fetch new data from stats.gov.cn
        run: python add_data/fetch_new_data.py

      - name: Parse HTML and update CSV
        run: python add_data/update_data.py

      - name: Regenerate plots
        run: python plot_cumulative_growth.py

      - name: Compute drop-from-peak stats
        run: python compute_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add add_data/*.html merged_housing_data_eng.csv plots/*.png stats.md stats.json README.md
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "Update housing index data (automated)"
            git push
          fi
